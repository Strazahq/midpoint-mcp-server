<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requests to approve</title>
<style>
/* Requests to approve: the approval inbox view (docs/ui-contract.md 7.1).
   Tokens are contract 6.9 (draft.11): midPoint blue, one tint for kinds, colour only for status. */
:root{
  --mp-font-sans:var(--font-sans, "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
  --mp-font-mono:var(--font-mono, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace);
  --mp-canvas:#ffffff; --mp-card:#ffffff; --mp-canvas-subtle:#f5f7fa; --mp-stripe:#f8f9fb;
  --mp-text:#465361; --mp-text-strong:#16202b; --mp-text-muted:#5b6673; --mp-label:#5b6673; --mp-link:#1f6fa3;
  --mp-border:#e2e7ed; --mp-divider:#e2e7ed; --mp-control-border:#8a96a3;
  --mp-primary:#1f6fa3; --mp-on-primary:#ffffff; --mp-primary-soft:#e6f1f8; --mp-secondary:#5b6673;
  --mp-success-fill:#126b33; --mp-on-success:#ffffff; --mp-danger-fill:#b4232a; --mp-on-danger:#ffffff;
  --mp-success-text:#126b33; --mp-danger-text:#b4232a; --mp-warning-text:#8a4b06; --mp-info-text:#1d4fc4; --mp-neutral-text:#4f5964;
  --mp-success-soft:#e1f4e7; --mp-danger-soft:#fde6e6; --mp-warning-soft:#fdf0cf; --mp-info-soft:#e5ecfd; --mp-neutral-soft:#eceff2;
  --mp-success-panel:#d1e7dd; --mp-danger-panel:#f8d7da; --mp-warning-panel:#fff3cd; --mp-info-panel:#cce6eb;
  --mp-tile-bg:#e6f1f8; --mp-tile-fg:#1f6fa3; --mp-avatar-bg:#e7ebf0; --mp-avatar-fg:#3d4a58;
  --mp-focus:#ffa836; --mp-focus-inner:#16202b;
  --mp-focus-shadow:0 0 0 2px var(--mp-canvas), 0 0 0 3px var(--mp-focus-inner);
  --mp-scrim:rgb(22 28 34 / .5);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --mp-canvas:#1a1f25; --mp-card:#20262d; --mp-canvas-subtle:#272e36; --mp-stripe:#232a31;
    --mp-text:#c0c9d2; --mp-text-strong:#edf1f5; --mp-text-muted:#97a3ae; --mp-label:#97a3ae; --mp-link:#5aa6dc;
    --mp-border:#313942; --mp-divider:#313942; --mp-control-border:#6b7682;
    --mp-primary:#5aa6dc; --mp-on-primary:#0b1a26; --mp-primary-soft:#1b3446; --mp-secondary:#97a3ae;
    --mp-success-fill:#6fdc97; --mp-on-success:#0b1a26; --mp-danger-fill:#ff9b9b; --mp-on-danger:#2a0b0d;
    --mp-success-text:#6fdc97; --mp-danger-text:#ff9b9b; --mp-warning-text:#f5c35b; --mp-info-text:#9cb8ff; --mp-neutral-text:#aeb7c0;
    --mp-success-soft:#163b25; --mp-danger-soft:#4a1d20; --mp-warning-soft:#3f3013; --mp-info-soft:#1e2c52; --mp-neutral-soft:#2b3138;
    --mp-success-panel:#3c5955; --mp-danger-panel:#634852; --mp-warning-panel:#6a6445; --mp-info-panel:#375763;
    --mp-tile-bg:#1b3446; --mp-tile-fg:#8cc4ea; --mp-avatar-bg:#2f3740; --mp-avatar-fg:#d5dde5;
    --mp-focus-shadow:none; --mp-scrim:rgb(0 0 0 / .55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --mp-canvas:#1a1f25; --mp-card:#20262d; --mp-canvas-subtle:#272e36; --mp-stripe:#232a31;
  --mp-text:#c0c9d2; --mp-text-strong:#edf1f5; --mp-text-muted:#97a3ae; --mp-label:#97a3ae; --mp-link:#5aa6dc;
  --mp-border:#313942; --mp-divider:#313942; --mp-control-border:#6b7682;
  --mp-primary:#5aa6dc; --mp-on-primary:#0b1a26; --mp-primary-soft:#1b3446; --mp-secondary:#97a3ae;
  --mp-success-fill:#6fdc97; --mp-on-success:#0b1a26; --mp-danger-fill:#ff9b9b; --mp-on-danger:#2a0b0d;
  --mp-success-text:#6fdc97; --mp-danger-text:#ff9b9b; --mp-warning-text:#f5c35b; --mp-info-text:#9cb8ff; --mp-neutral-text:#aeb7c0;
  --mp-success-soft:#163b25; --mp-danger-soft:#4a1d20; --mp-warning-soft:#3f3013; --mp-info-soft:#1e2c52; --mp-neutral-soft:#2b3138;
  --mp-success-panel:#3c5955; --mp-danger-panel:#634852; --mp-warning-panel:#6a6445; --mp-info-panel:#375763;
  --mp-tile-bg:#1b3446; --mp-tile-fg:#8cc4ea; --mp-avatar-bg:#2f3740; --mp-avatar-fg:#d5dde5;
  --mp-focus-shadow:none; --mp-scrim:rgb(0 0 0 / .55);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--mp-canvas);container-type:inline-size;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.mp-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}

.mp{position:relative;display:grid;gap:12px;align-content:start;min-height:96px;padding:12px;
  background:var(--mp-canvas);color:var(--mp-text);font-family:var(--mp-font-sans);font-size:14px;line-height:1.5;font-weight:400;min-width:0}
.mp *{font-weight:inherit}
.mp b,.mp strong{font-weight:700}
.mp p{margin:0}
.mp :focus{outline:none}
.mp :focus-visible{outline:2px solid var(--mp-focus);outline-offset:3px;box-shadow:var(--mp-focus-shadow)}

.mp-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px 12px;padding-bottom:10px;border-bottom:1px solid var(--mp-divider)}
.mp.is-full .mp-head{position:sticky;top:0;z-index:5;background:var(--mp-canvas);padding-top:12px;margin-top:-12px}
.mp-head-main{display:grid;gap:4px;min-width:0;flex:1 1 260px}
.mp-title{margin:0;font-size:16px;font-weight:700;line-height:1.3;color:var(--mp-text-strong)}
.mp-ident{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;color:var(--mp-text)}
.mp-ident-who{display:flex;align-items:flex-start;gap:6px;min-width:0}
.mp-ident-who > svg{flex:none;margin-top:4px;color:var(--mp-text-muted)}
.mp-head-actions{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.mp-help{flex-basis:100%;font-size:12px;color:var(--mp-text-muted);max-width:64ch}
.mp-note{font-size:12px;color:var(--mp-text-muted)}
.mp-note-row{display:flex;align-items:center;gap:6px}
.mp-muted{color:var(--mp-text-muted);font-size:12px}
.mp-label{font-size:12px;color:var(--mp-label)}
.mp-section-title{margin:0;font-size:14px;font-weight:700;color:var(--mp-text-strong)}
.mp-content{display:grid;gap:12px;min-width:0;transition:opacity .1s}
.mp-content.is-busy{opacity:.45}
.mp-foot{display:grid;gap:2px;padding-top:8px;border-top:1px solid var(--mp-divider);font-size:12px;color:var(--mp-text-muted)}

.mp-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:0 12px;border-radius:4px;border:1px solid transparent;
  font-family:inherit;font-size:14px;line-height:1.2;white-space:nowrap;cursor:pointer;transition:background-color .1s,color .1s}
.mp-btn--primary{background:var(--mp-primary);color:var(--mp-on-primary)}
.mp-btn--secondary{background:var(--mp-secondary);color:var(--mp-on-primary)}
.mp-btn--danger{background:var(--mp-danger-fill);color:var(--mp-on-primary)}
.mp-btn--tool{min-height:28px;padding:0 10px;background:var(--mp-canvas);color:var(--mp-text-strong);border-color:var(--mp-control-border)}
.mp-btn--link{min-height:24px;padding:0 2px;background:none;border:0;color:var(--mp-link);text-decoration:underline;text-underline-offset:2px;white-space:normal;text-align:left}
.mp-open{gap:3px;font-size:12px;font-weight:400}
.mp-btn--link > svg{transition:transform .1s}
.mp-btn--link[aria-expanded="true"] > svg:first-child{transform:rotate(90deg)}
.mp-btn--primary:hover:not(:disabled),.mp-btn--secondary:hover:not(:disabled),.mp-btn--danger:hover:not(:disabled){filter:brightness(.92)}
.mp-btn--tool:hover:not(:disabled){background:var(--mp-canvas-subtle)}
.mp-btn:disabled{opacity:.6;cursor:not-allowed}
.mp-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

.mp-chip{display:inline-flex;align-items:center;gap:4px;min-height:20px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.2;white-space:nowrap;
  background:var(--mp-secondary);color:var(--mp-on-primary)}
.mp-chip--success{background:var(--mp-success-fill)}
.mp-chip--danger{background:var(--mp-danger-fill)}
.mp-chip--warning{background:var(--mp-warning-fill);color:var(--mp-on-dark-badge)}
.mp-chip--outline{background:transparent;color:var(--mp-text-strong);border:1px solid var(--mp-control-border);font-weight:400;white-space:normal}
.mp-chip--meta{background:var(--mp-canvas-subtle);color:var(--mp-text-strong);border:1px solid var(--mp-border);font-weight:400}

/* 6.4, D31: one neutral icon per kind; no archetype colours */
.mp-disc{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;flex:none;background:var(--mp-canvas-subtle);color:var(--mp-text-muted);box-shadow:inset 0 0 0 1px var(--mp-border)}
.mp-disc--sm{width:20px;height:20px}
.mp-badge{display:inline-flex;align-items:center;gap:8px;min-width:0;vertical-align:middle}
.mp-badge-text{display:grid;min-width:0;line-height:1.3}
.mp-badge-name{color:var(--mp-text-strong);overflow-wrap:anywhere}
.mp-inline{display:inline-flex;align-items:center;gap:5px;vertical-align:middle;color:var(--mp-text-strong);flex-wrap:wrap}
.mp-inline .mp-disc{width:20px;height:20px}
.mp-status-note{font-size:12px;color:var(--mp-text-muted)}

.mp-panel{display:grid;gap:4px;padding:10px 12px;border-radius:4px;color:var(--mp-text);min-width:0}
.mp-panel--success{background:var(--mp-success-panel)}
.mp-panel--danger{background:var(--mp-danger-panel)}
.mp-panel--warning{background:var(--mp-warning-panel)}
.mp-panel--info{background:var(--mp-info-panel)}
.mp-panel-title{display:flex;align-items:flex-start;gap:6px;font-weight:700;color:var(--mp-text-strong)}
.mp-panel-title svg{flex:none;margin-top:3px}
.mp-panel--success .mp-panel-title svg{color:var(--mp-success-text)}
.mp-panel--danger .mp-panel-title svg{color:var(--mp-danger-text)}
.mp-panel--warning .mp-panel-title svg{color:var(--mp-warning-text)}
.mp-panel--info .mp-panel-title svg{color:var(--mp-link)}
.mp-panel .mp-muted{color:var(--mp-text)}
.mp-banner{display:flex;align-items:flex-start;gap:8px;margin:0;padding:10px 12px;border-radius:4px;color:var(--mp-text-strong)}
.mp-banner svg{flex:none;margin-top:3px}
.mp-banner--info{background:var(--mp-info-panel)}
.mp-banner--info svg{color:var(--mp-link)}
.mp-banner--warning{background:var(--mp-warning-panel)}
.mp-banner--warning svg{color:var(--mp-warning-text)}
/* 6.9: on tinted surfaces the label and link blues fall under 4.5:1, so labels take --mp-text, links --mp-text-strong, underlined */
.mp-panel .mp-label,.mp-card-head .mp-label,.mp-card-foot .mp-label{color:var(--mp-text)}
.mp-panel .mp-btn--link,.mp-banner .mp-btn--link,.mp-quote .mp-btn--link,.mp-card-head .mp-btn--link,.mp-card-foot .mp-btn--link{color:var(--mp-text-strong);text-decoration:underline}
.mp-details{display:grid;gap:4px;padding:8px 10px;border-radius:4px;background:var(--mp-canvas-subtle);font:12px/1.5 var(--mp-font-mono);color:var(--mp-text);white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.mp-details-lab{font-family:var(--mp-font-sans);font-weight:700;color:var(--mp-text-strong)}
.mp-textblock{margin:0;padding:10px 12px;border:1px solid var(--mp-border);border-radius:4px;background:var(--mp-canvas-subtle);font:13px/1.5 var(--mp-font-mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--mp-text)}

/* skeleton: no animation (6.10 allows only 100 ms opacity or colour transitions) */
.mp-skel{display:block;height:12px;border-radius:4px;background:var(--mp-canvas-subtle)}
.mp-skel-head{display:grid;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--mp-divider)}
.mp-skel-row{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--mp-divider)}
.mp-skel-row .mp-skel-disc{width:24px;height:24px;border-radius:50%}
.mp-skel-lines{display:grid;gap:6px}

.mp-field{display:grid;gap:4px;min-width:0}
.mp-field label{font-size:14px;font-weight:700;color:var(--mp-text-strong);padding:0}
.mp-textarea{width:100%;min-height:76px;padding:5px 8px;border:1px solid var(--mp-control-border);border-radius:4px;background:var(--mp-canvas);color:var(--mp-text-strong);font-family:inherit;font-size:14px;resize:vertical;line-height:1.45}
.mp-textarea[aria-invalid="true"]{border-color:var(--mp-danger-text)}
.mp-field-error{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mp-danger-text)}
.mp-field-foot{display:flex;justify-content:flex-end;gap:10px;align-items:flex-start;min-height:18px}
.mp-counter{font-size:12px;color:var(--mp-text-muted)}

.mp-rows{list-style:none;margin:0;padding:0;display:grid}
.mp-rows>li{display:grid;gap:6px;padding:8px 0;border-bottom:1px solid var(--mp-divider);min-height:40px;min-width:0;align-content:center}
.mp-rows>li:last-child{border-bottom:0}
.mp-row-main{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;min-width:0}
/* D33: clamped text is cut in script at a word boundary and ends with one "…" */
.mp-clamp{overflow-wrap:anywhere}
.mp-more{justify-self:start}

.mp-summary{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--mp-text-strong)}
.mp-summary svg{color:var(--mp-link)}
.mp-cards{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.mp-card{display:grid;border:1px solid var(--mp-border);border-radius:8px;background:var(--mp-canvas);overflow:hidden;min-width:0}
.mp-card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 12px;background:var(--mp-canvas-subtle);border-bottom:1px solid var(--mp-border)}
.mp-card-title{display:grid;gap:2px;min-width:0;flex:1 1 220px}
.mp-card-title h2{margin:0;min-width:0}
.mp-card-title .mp-badge-name{font-weight:700}
.mp-card-chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.mp-card-body{display:grid;gap:10px;padding:12px;min-width:0}
.mp-card-more{display:grid;gap:14px;padding:12px;border-top:1px solid var(--mp-border);min-width:0}
.mp-card-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 12px;background:var(--mp-canvas-subtle);border-top:1px solid var(--mp-border)}
.mp-card-foot .mp-actions{margin-left:auto}
.mp-sub{display:grid;gap:6px;min-width:0}
.mp-sub-title{margin:0;font-size:13px;font-weight:700;color:var(--mp-text-strong)}
.mp-line{display:flex;align-items:flex-start;gap:8px;margin:0;color:var(--mp-text-strong)}
.mp-line > svg{flex:none;margin-top:4px;color:var(--mp-text-muted)}
.mp-lines{display:grid;gap:4px}
.mp-about-text{color:var(--mp-text)}
.mp-quote{display:grid;gap:4px;margin:0;padding:8px 12px;border-left:3px solid var(--mp-border);background:var(--mp-canvas-subtle);border-radius:0 4px 4px 0}
.mp-quote-lab{font-size:12px;color:var(--mp-text)}
.mp-quote blockquote{margin:0;display:grid;gap:2px}
.mp-quote-text{color:var(--mp-text-strong);white-space:pre-wrap;overflow-wrap:anywhere}
.mp-outcome{display:grid;gap:8px}
.mp-openline{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;margin:0;font-size:12px}
.mp-openline .mp-label{color:var(--mp-text-muted)}
.mp-timeline{list-style:none;margin:0;padding:0 0 0 12px;display:grid;gap:10px;border-left:2px solid var(--mp-border)}
.mp-timeline li{display:grid;gap:4px}
.mp-tl-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;color:var(--mp-text-strong)}
.mp-tl-step{font-weight:700;color:var(--mp-text-strong)}
@container (min-width:560px){
  .mp{padding:16px}
  .mp.is-full .mp-head{padding-top:16px;margin-top:-16px}
  .mp-card-head,.mp-card-body,.mp-card-more,.mp-card-foot{padding-inline:16px}
}

/* dialog (6.5) */
.mp-overlay{position:absolute;inset:0;z-index:10;padding:12px;background:var(--mp-scrim)}
.mp-dialog{position:sticky;top:12px;display:grid;gap:12px;max-width:500px;margin-inline:auto;padding:16px;border-radius:8px;background:var(--mp-canvas);border:1px solid var(--mp-border);box-shadow:0 12px 32px rgb(0 0 0 / .28)}
.mp-dialog h2{margin:0;font-size:16px;font-weight:700;color:var(--mp-text-strong);overflow-wrap:anywhere}
.mp-dialog-body{display:grid;gap:6px}
.mp-dialog .mp-actions{justify-content:flex-end}

/* ===== readability layer (contract 1.0-draft.11, D39): hierarchy, kind tiles, status pills, labelled facts ===== */
.mp-title{font-size:17px;letter-spacing:-.005em}
.mp-section-title{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mp-text)}
.mp-note,.mp-muted,.mp-foot{color:var(--mp-text-muted)}
.mp-btn{min-height:36px;border-radius:8px;font-weight:600}
.mp-btn--tool{min-height:32px;border-radius:8px;background:var(--mp-card);color:var(--mp-text);border-color:var(--mp-control-border);font-weight:600}
.mp-btn--secondary,.mp-btn--ghost{background:var(--mp-card);color:var(--mp-text-strong);border-color:var(--mp-control-border)}
.mp-btn--secondary:hover:not(:disabled),.mp-btn--ghost:hover:not(:disabled){filter:none;background:var(--mp-canvas-subtle)}
.mp-btn--approve{background:var(--mp-success-fill);color:var(--mp-on-success)}
.mp-btn--reject{background:var(--mp-card);color:var(--mp-danger-text);border-color:currentColor}
.mp-btn--approve:hover:not(:disabled){filter:brightness(.92)}
.mp-btn--reject:hover:not(:disabled){background:var(--mp-danger-soft)}
.mp-btn--link{min-height:32px;font-weight:600;text-decoration:none}
.mp-btn--link:hover{text-decoration:underline}

/* pills: a colour, a glyph and a word; red only means danger */
.mp-chip{min-height:22px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--mp-neutral-soft);color:var(--mp-neutral-text);border:0}
.mp-chip--secondary,.mp-chip--meta,.mp-chip--outline{background:var(--mp-neutral-soft);color:var(--mp-neutral-text);border:0}
.mp-chip--outline{font-weight:600}
.mp-chip--success{background:var(--mp-success-soft);color:var(--mp-success-text)}
.mp-chip--danger{background:var(--mp-danger-soft);color:var(--mp-danger-text)}
.mp-chip--alarm{background:var(--mp-danger-fill);color:var(--mp-on-danger)}
.mp-chip--warning{background:var(--mp-warning-soft);color:var(--mp-warning-text)}
.mp-chip--info{background:var(--mp-info-soft);color:var(--mp-info-text)}
.mp-step{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--mp-text);white-space:nowrap}

/* kind tiles: a rounded square for a thing, a circle with initials for a person (shape says kind; one tint) */
.mp-disc{width:32px;height:32px;border-radius:8px;background:var(--mp-tile-bg);color:var(--mp-tile-fg);box-shadow:none}
.mp-disc--sm,.mp-inline .mp-disc{width:22px;height:22px;border-radius:6px}
.mp-disc--lg{width:44px;height:44px}
.mp-disc--person{border-radius:50%;background:var(--mp-avatar-bg);color:var(--mp-avatar-fg)}
.mp-disc[data-initials]::before{content:attr(data-initials);font-size:12px;font-weight:700;letter-spacing:.02em;line-height:1}
.mp-disc--sm[data-initials]::before,.mp-inline .mp-disc[data-initials]::before{font-size:9.5px}
.mp-disc--lg[data-initials]::before{font-size:16px}
.mp-tname{display:inline}
.mp-tname > .mp-disc{display:inline-block;vertical-align:-5px;margin-right:6px;text-align:center;line-height:20px}
.mp-tname > .mp-disc > svg{vertical-align:middle}
.mp-badge-name{color:var(--mp-text-strong);font-weight:600}

/* panels keep midPoint's alert tints; their text is the strong ink in both themes */
.mp-panel,.mp-panel .mp-muted{color:var(--mp-text-strong)}

/* cards (A): avatar | who → what; pills; labelled facts; foot with actions */
.mp-card{border-radius:12px;background:var(--mp-card)}
.mp-card-head{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:8px 12px;padding:14px 14px 0;background:none;border-bottom:0}
.mp-card-title{gap:2px}
.mp-card-title h2{font-size:16px;font-weight:700;line-height:1.35;color:var(--mp-text-strong)}
.mp-card-title .mp-about-text{font-size:14px;color:var(--mp-text)}
.mp-card-chips{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.mp-card-body{gap:12px;padding:12px 14px 14px 58px}
.mp-card-more{padding:12px 14px;background:var(--mp-canvas-subtle)}
.mp-card-foot{padding:10px 14px;background:none}
.mp-facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;margin:0}
.mp-facts dt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mp-text-muted);padding-top:3px;max-width:180px;overflow-wrap:anywhere}
.mp-facts dd{margin:0;color:var(--mp-text-strong);min-width:0;overflow-wrap:anywhere}
/* D43: a requested field's value is the requester's text, kept as typed */
.mp-facts dd.mp-fact-long{display:grid;gap:2px}
.mp-fact-text{white-space:pre-wrap}
.mp-quote{border-left:0;border-radius:8px;padding:10px 12px;background:var(--mp-canvas-subtle)}
.mp-quote-lab{font-weight:600;color:var(--mp-text)}
.mp-quote-text{font-size:15px}
.mp-summary svg{color:var(--mp-primary)}

/* ledger (B, full screen): one row per item, the open one shows its card */
.mp-ledger{list-style:none;margin:0;padding:0;display:grid;border:1px solid var(--mp-border);border-radius:12px;overflow:hidden;background:var(--mp-card)}
.mp-ledger > li + li{border-top:1px solid var(--mp-border)}
.mp-lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;align-items:center;width:100%;min-height:52px;padding:10px 14px;background:none;border:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.mp-lrow:hover{background:var(--mp-canvas-subtle)}
.mp-lrow[aria-expanded="true"]{background:var(--mp-primary-soft)}
.mp-lrow[aria-expanded="true"] > svg{transform:rotate(90deg)}
.mp-lrow-title{color:var(--mp-text-strong);font-weight:600;overflow-wrap:anywhere}
.mp-lrow-meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:4px}
.mp-ledger .mp-card{border:0;border-radius:0}
.mp-ledger .mp-card-body{padding-top:4px}
.mp-lrow-title{font-size:15px}

@container (min-width:560px){
  .mp-card-head,.mp-card-more,.mp-card-foot{padding-inline:16px}
  .mp-card-body{padding-inline:60px 16px}
}
@container (max-width:469px){
  .mp-card-body{padding-left:14px}
  .mp-facts{grid-template-columns:minmax(0,1fr);gap:0}
  .mp-facts dt{max-width:none}
  .mp-facts dd{margin-bottom:8px}
  .mp-btn{min-height:40px}
  .mp-btn--link{min-height:32px}
}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

      if (!d){ S.phase = 'text'; S.entryText = textOf(res); askWhoami(); return render(); }
      row = outcomeOf(d, d.decision);
      if (d.acting) S.acting = d.acting;
      if (d.server) S.server = d.server;
    }
    S.phase = 'loaded'; S.notice = row;
    if (canCall()){ S.listPending = true; callTool('list_work_items', refreshArgs()).then(r => { onListAnswer(r, false); render(); }); }
    else if (!S.acting) askWhoami();
    return render();
  }
  if (res.isError === true){ S.phase = 'error'; S.entryError = errOf(res, S.entryTool); askWhoami(); return render(); }
  const l = normList(sc);
  if (!l){ S.phase = 'text'; S.entryText = textOf(res); if (sc) S.acting = normActing(sc.acting); if (!S.acting) askWhoami(); return render(); }
  S.phase = 'loaded';
  applySnapshot(l, sig(sc));
  render();
}

/* ================= render: the whole view from state; focus kept by data-k ================= */
let slowTimer = 0;
function armSlow(){
  /* 6.5: the one timer; it wakes when the oldest wait reaches 8 s, so state.slow can appear */
  clearTimeout(slowTimer);
  const now = Date.now(), starts = [];
  if (S.phase === 'wait' && S.inputAt) starts.push(S.inputAt);
  if (S.busy) starts.push(S.busyAt);
  if (S.dialog && S.dialog.working) starts.push(S.dialog.at);
  for (const k in S.hist) if (S.hist[k].state === 'loading' && S.det[k]) starts.push(S.hist[k].at);
  const next = starts.map(a => a + SLOW_MS - now).filter(ms => ms > 0);
  if (next.length) slowTimer = setTimeout(render, Math.min.apply(null, next) + 20);
}
function build(){
  if (S.phase === 'mismatch') return [h('div', {class:'mp-panel mp-panel--info', role:'status'}, h('p', {class:'mp-panel-title'}, icon('info'), t('state.versionMismatch'))),
    h('pre', {class:'mp-textblock'}, S.entryText)];
  if (S.phase === 'wait') return [h('div', {'aria-busy':'true'}, skeletonEl())];
  const content = h('main', {class:'mp-content' + (S.busy ? ' is-busy' : ''), 'aria-busy':S.busy || (S.listPending && !S.items) ? 'true' : null}, contentEl());
  const parts = [headerEl(), bannersEl(), content, footerEl()].flat();
  if (S.dialog) parts.forEach(el => el.setAttribute('inert', ''));
  if (S.dialog) parts.push(dialogEl());
  return parts;
}
function render(o){
  o = o || {};
  const ae = document.activeElement, inside = ae && ae !== document.body && $root.contains(ae);
  const keep = o.focus || (inside ? ae.getAttribute('data-k') : null);
  const sel = !o.focus && inside && ae.tagName === 'TEXTAREA' ? [ae.selectionStart, ae.selectionEnd] : null;
  LINKED = false;
  $root.classList.toggle('is-full', isFull());
  $root.style.minHeight = '';
  $root.replaceChildren(...build());
  if (keep){
    const el = $root.querySelector('[data-k="' + CSS.escape(keep) + '"]');
    if (el){
      el.focus({preventScroll:!o.focus});
      if (el.tagName === 'TEXTAREA'){ const n = el.value.length; try { el.setSelectionRange(sel ? sel[0] : n, sel ? sel[1] : n); } catch (e) { /* not focusable */ } }
    }
  }
  if (S.dialog){ const box = $root.querySelector('.mp-dialog'); if (box) $root.style.minHeight = Math.max(360, box.offsetHeight + 24) + 'px'; }
  clampPass();
  armSlow();
}

/* ================= size (6.13): report content size, only on change ================= */
let sizeQueued = false, lastW = -1, lastH = -1, lastRootW = -1;
function reportSize(){
  sizeQueued = false;
  const rw = $root.clientWidth;
  if (rw !== lastRootW){ lastRootW = rw; clampPass(); }
  if (!S.init) return;
  const w = Math.ceil(document.documentElement.clientWidth), hh = Math.ceil($root.getBoundingClientRect().height);
  if (w === lastW && hh === lastH) return;
  lastW = w; lastH = hh;
  notify('ui/notifications/size-changed', {width:w, height:hh});
}
new ResizeObserver(() => { if (!sizeQueued){ sizeQueued = true; requestAnimationFrame(reportSize); } }).observe($root);

/* ================= start (3.5) ================= */
render();
request('ui/initialize', {appInfo:APP_INFO, appCapabilities:{availableDisplayModes:['inline', 'fullscreen']}, protocolVersion:PROTOCOL}).then(r => {
  const res = isObj(r.result) ? r.result : {};
  S.caps = isObj(res.hostCapabilities) ? res.hostCapabilities : {};
  mergeCtx(res.hostContext);
  applyCtx();
  S.init = true;
  notify('ui/notifications/initialized', {});
  render();
  reportSize();
});
})();
</script>
