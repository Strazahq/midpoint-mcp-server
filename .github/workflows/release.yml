name: Release

on:
  push:
    tags: ["v*"]

# No job gets a permission it does not ask for below.
permissions: {}

env:
  IMAGE: ghcr.io/strazahq/midpoint-mcp-server

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # Every check that can refuse the release runs here, before anything is
  # built or pushed.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a CHANGELOG.md section for this tag
        run: .github/scripts/changelog-section.sh "${GITHUB_REF_NAME}" > /dev/null

      - name: Render the Kubernetes manifest
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          kustomization=deploy/kubernetes/kustomization.yaml
          out=dist/midpoint-mcp-server-kubernetes.yaml
          mkdir -p dist
          if [ ! -f "${kustomization}" ]; then
            echo "::error::Release refused: ${kustomization} is missing on the tagged commit. The release attaches the manifest rendered from it. Restore deploy/kubernetes, then delete the tag and push it again on that commit."
            exit 1
          fi
          VERSION="${version}" yq -i \
            '(.images[] | select(.name == strenv(IMAGE))).newTag = strenv(VERSION)' \
            "${kustomization}"
          kubectl kustomize deploy/kubernetes > "${out}"
          refs=$(grep -o "${IMAGE}[^[:space:]\"']*" "${out}" | sort -u || true)
          if [ "${refs}" != "${IMAGE}:${version}" ]; then
            echo "::error::Release refused: the rendered manifest does not use exactly ${IMAGE}:${version}. It uses: ${refs:-no ${IMAGE} image}. Check that the images entry named ${IMAGE} in ${kustomization} sets newTag, then delete the tag and push it again."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-kubernetes
          path: dist/midpoint-mcp-server-kubernetes.yaml
          if-no-files-found: error

  binaries:
    needs: [test, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # sign the provenance attestation with Sigstore
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          # Release binaries use the newest 1.25 patch and never a build cache
          # that another workflow run wrote.
          check-latest: true
          cache: false

      - name: Build binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            name="midpoint-mcp-server_${version}_${os}_${arch}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            mkdir -p "dist/${name}"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X main.version=${version}" \
              -o "dist/${name}/midpoint-mcp-server${ext}" .
            cp README.md LICENSE CHANGELOG.md "dist/${name}/"
            if [ "$os" = "windows" ]; then
              (cd dist && zip -qr "${name}.zip" "${name}")
            else
              tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            fi
          done

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Write the SBOM of the binaries
        run: |
          syft scan "dir:dist" \
            --source-name midpoint-mcp-server \
            --source-version "${GITHUB_REF_NAME}" \
            -o "spdx-json=dist/midpoint-mcp-server_${GITHUB_REF_NAME}_binaries.spdx.json"

      - name: Attest build provenance of the binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*/midpoint-mcp-server*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.spdx.json
          if-no-files-found: error

  image:
    needs: [test, gate]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write # push the image, its signature and its attestation to ghcr.io
      id-token: write # sign the image and its provenance attestation with Sigstore
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The labels carry the OCI source, version, revision and licenses keys.
      # The tags are computed again in tag-image, which adds them last.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          # Pushed by digest with no tag, so nothing is pullable by version until
          # the image is signed and the release exists. tag-image adds the tags.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # The provenance attestation further down replaces the BuildKit one,
          # so the pushed index lists only the two platform images.
          provenance: false

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Write the SBOMs of the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for platform in linux/amd64 linux/arm64; do
            syft scan --platform "${platform}" "registry:${IMAGE}@${DIGEST}" \
              -o "spdx-json=dist/midpoint-mcp-server_${GITHUB_REF_NAME}_image_${platform/\//_}.spdx.json"
          done

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # A storage record needs the artifact-metadata permission, which
          # this job does not ask for. The attestation does not need it.
          create-storage-record: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-sbom
          path: dist/*.spdx.json
          if-no-files-found: error

  release:
    needs: [gate, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign checksums.txt with Sigstore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Write checksums.txt
        working-directory: dist
        run: sha256sum -- * > checksums.txt

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums.txt
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Write the release notes from CHANGELOG.md
        run: .github/scripts/changelog-section.sh "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"

  # Runs last: the version tags appear only after the image is signed and the
  # GitHub release exists, so a failed run never leaves a tagged, unsigned image.
  tag-image:
    needs: [image, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # add the version tags to the signed image in ghcr.io
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags X.Y.Z, X.Y and latest.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Tag the signed image and check every tag points at the signed digest
        env:
          DIGEST: ${{ needs.image.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] && args+=(-t "${tag}")
          done <<< "${TAGS}"
          # With a single source, imagetools create copies the index unchanged,
          # so the tags point at the digest that was signed.
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            got="$(docker buildx imagetools inspect "${tag}" --format '{{.Manifest.Digest}}')"
            if [ "${got}" != "${DIGEST}" ]; then
              echo "The tag ${tag} points at ${got}, not at the signed digest ${DIGEST}. Delete the tag in the package settings and rerun this job."
              exit 1
            fi
          done <<< "${TAGS}"
