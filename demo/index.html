<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>midPoint MCP views demo</title>

<style>
/* The simulated host's own look: neutral, system fonts, light and dark. */
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --bg: #f3f4f6;
  --surface: #ffffff;
  --surface-2: #eceef1;
  --text: #1b1d21;
  --muted: #5d636d;
  --border: #dadde2;
  --accent: #2c55c9;
  --on-accent: #ffffff;
  --user-bg: #dfe6f5;
  --code-bg: #f0f2f5;
  --ask-bg: #fffaeb;
  --ask-border: #d9a520;
  --ok: #1c7444;
  --bad: #b02a22;
  --name-bg: #e3f0e6;
  --name-text: #185c37;
  --focus: #2c55c9;
  --shadow: 0 1px 2px rgba(20, 24, 31, .06), 0 4px 16px rgba(20, 24, 31, .08);
  --vw: 640px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a;
    --surface: #1e2125;
    --surface-2: #272a30;
    --text: #e7e9ec;
    --muted: #a3a9b3;
    --border: #353a42;
    --accent: #93b1ff;
    --on-accent: #0e1422;
    --user-bg: #2a3346;
    --code-bg: #191c20;
    --ask-bg: #2a2416;
    --ask-border: #b48b2a;
    --ok: #74d39c;
    --bad: #f3928a;
    --name-bg: #1f3a2a;
    --name-text: #9fe0b8;
    --focus: #93b1ff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a;
  --surface: #1e2125;
  --surface-2: #272a30;
  --text: #e7e9ec;
  --muted: #a3a9b3;
  --border: #353a42;
  --accent: #93b1ff;
  --on-accent: #0e1422;
  --user-bg: #2a3346;
  --code-bg: #191c20;
  --ask-bg: #2a2416;
  --ask-border: #b48b2a;
  --ok: #74d39c;
  --bad: #f3928a;
  --name-bg: #1f3a2a;
  --name-text: #9fe0b8;
  --focus: #93b1ff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 var(--font);
  overflow-x: clip;
  -webkit-text-size-adjust: 100%;
}
button, select { font: inherit; color: inherit; }
code, pre { font-family: var(--mono); font-size: 12.5px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 8px; top: -40px; background: var(--surface); padding: 6px 10px; border-radius: 6px; z-index: 10; }
.skip:focus { top: 8px; }

[hidden] { display: none !important; }

/* --- layout: top bar, scenario list, chat --- */
.top {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { min-width: 0; flex: 1; }
h1 { font-size: 16px; line-height: 1.3; margin: 0; font-weight: 650; letter-spacing: -.005em; }
.title-sub { color: var(--muted); font-weight: 450; }
.fine { margin: 1px 0 0; color: var(--muted); font-size: 12px; max-width: 80ch; }
.ibtn {
  flex: none; width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface);
  color: var(--muted); display: inline-grid; place-items: center; cursor: pointer;
}
.ibtn:hover { background: var(--surface-2); color: var(--text); }
.menu { display: none; }
.app-body { display: grid; grid-template-columns: 272px minmax(0, 1fr); align-items: start; }
.side {
  position: sticky; top: 57px; height: calc(100vh - 57px); overflow-y: auto; background: var(--surface);
  border-right: 1px solid var(--border); padding: 8px 8px 24px;
}
.grp { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 12px 10px 4px; }
.convs { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.conv {
  width: 100%; display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left;
  border: 0; background: none; border-radius: 10px; padding: 8px 10px; cursor: pointer; color: var(--text);
}
.conv:hover { background: var(--surface-2); }
.conv[aria-current="true"] { background: var(--user-bg); }
.cav {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700;
  background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
}
.conv[aria-current="true"] .cav { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.ctext { min-width: 0; display: grid; gap: 1px; }
.ctext b { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctext span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 6; }
.btn-quiet { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 12px; min-height: 32px; cursor: pointer; font-size: 13px; }
.btn-quiet:hover { background: var(--surface-2); }

/* the line above the chat */
.scn-line { border-bottom: 1px solid var(--border); background: var(--bg); padding: 10px 16px; }
.scn-row { width: min(var(--vw), 100%); margin: 0 auto; display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; }
.scn-who { margin: 0; flex: 1 1 260px; min-width: 0; font-size: 14px; display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: baseline; }
.scn-hint { color: var(--muted); font-size: 13.5px; }
.scn-acts { display: flex; gap: 12px; align-items: center; }
.scn-more { width: min(var(--vw), 100%); margin: 8px auto 0; font-size: 13.5px; color: var(--muted); }
.scn-more p { margin: 2px 0; }
.scn-more b { color: var(--text); font-weight: 600; }

/* above each view: what to show, and the view size */
.vbar { display: flex; align-items: center; gap: 8px; width: 100%; margin-bottom: 6px; flex-wrap: wrap; }
.vtabs { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--surface); }
.vtabs button { border: 0; background: none; padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--muted); min-height: 32px; }
.vtabs button + button { border-left: 1px solid var(--border); }
.vtabs button[aria-selected="true"] { background: var(--surface-2); color: var(--text); font-weight: 600; }
.sizes { margin-left: auto; display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--surface); }
.sizes button { border: 0; background: none; width: 36px; height: 32px; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.sizes button + button { border-left: 1px solid var(--border); }
.sizes button[aria-checked="true"] { background: var(--accent); color: var(--on-accent); }

/* under the chat: where this scenario sits, and the next one */
.nextbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin: 18px 0 4px; font-size: 13px; color: var(--muted); }
.nextbar .next { font-size: 14px; font-weight: 600; text-decoration: none; }
.nextbar .next:hover { text-decoration: underline; }

@media (max-width: 860px) {
  .menu { display: inline-grid; }
  .app-body { grid-template-columns: minmax(0, 1fr); }
  .side {
    position: fixed; top: 0; left: 0; bottom: 0; height: auto; width: min(300px, 84vw); z-index: 7;
    transform: translateX(-102%); transition: transform .18s; box-shadow: 4px 0 24px rgba(0, 0, 0, .2); padding-top: 14px;
  }
  .drawer-open .side { transform: none; }
  .fine { display: none; }
}

/* --- chat column --- */
.chat { padding: 0 0 0; outline: none; min-width: 0; }
.col { padding: 18px 16px 0; }
.col { width: min(var(--vw), 100%); margin: 0 auto; }
.transcript { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.transcript > li { min-width: 0; }

.msg-user { align-self: flex-end; max-width: 85%; }
.bubble { background: var(--user-bg); border-radius: 16px 16px 4px 16px; padding: 9px 14px; overflow-wrap: anywhere; }
.msg-user .who { display: block; text-align: right; font-size: 11.5px; color: var(--muted); margin: 0 4px 3px; }
.msg-assistant { display: flex; gap: 10px; align-items: flex-start; }
.avatar {
  flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border);
  display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 1px;
}
.msg-assistant .body { min-width: 0; flex: 1; }
.msg-assistant p { margin: 2px 0 8px; }

/* tool-call chip */
.toolcall { display: inline-block; max-width: 100%; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); background: var(--surface);
  border-radius: 999px; padding: 4px 12px 4px 9px; cursor: pointer; font-size: 13px; max-width: 100%;
}
.chip:hover { background: var(--surface-2); }
.chip .srv { color: var(--muted); }
.chip code { font-size: 12.5px; overflow-wrap: anywhere; }
.chip svg { width: 14px; height: 14px; }
.chip .chev { transition: transform .15s; color: var(--muted); flex: none; }
.chip[aria-expanded="true"] .chev { transform: rotate(90deg); }
.tick { color: var(--ok); flex: none; }
.chip-panel {
  margin-top: 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); padding: 10px 12px; font-size: 13px;
}
.chip-panel[hidden] { display: none; }
.lab { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 4px; }
pre.json {
  margin: 0 0 10px; padding: 8px 10px; background: var(--code-bg); border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere;
}
.about { color: var(--muted); margin: 0; }
.fx { font-family: var(--mono); font-size: 12px; background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }

/* the view */
.view-li { display: flex; flex-direction: column; align-items: flex-start; }
.viewblock { width: 100%; max-width: 100%; position: relative; transition: width .2s; }
.viewblock iframe {
  display: block; width: 100%; height: 160px; border: 1px solid var(--border); border-radius: 12px;
  background: var(--surface); box-shadow: var(--shadow);
}
.viewblock.full { max-width: none; }
.viewblock.full iframe { border-color: var(--accent); }
.viewcap { font-size: 11.5px; color: var(--muted); margin: 6px 2px 0; display: flex; gap: 6px; flex-wrap: wrap; }
.viewcap code { font-size: 11.5px; }
.mode-tag { color: var(--accent); font-weight: 600; }

/* what the model reads */
.model { margin-top: 8px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 10px 10px 0; padding: 8px 12px; width: 100%; }
.model-head { margin: 0 0 4px; display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; }
.model .lab { color: var(--accent); margin: 0; }
.model-src { font-size: 12px; color: var(--muted); }
.model-src code { font-size: 12px; color: var(--text); }
.model pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; line-height: 1.5; }

/* host notes */
.event { font-size: 13px; color: var(--muted); padding-left: 36px; }
.event details { border-radius: 8px; }
.event summary { cursor: pointer; list-style: none; display: flex; gap: 7px; align-items: baseline; padding: 2px 0; }
.event summary::-webkit-details-marker { display: none; }
.event summary::before { content: "\25B8"; font-size: 10px; flex: none; transition: transform .15s; position: relative; top: -1px; }
.event details[open] summary::before { transform: rotate(90deg); }
.event summary code { color: var(--text); }
.event .ev-body { margin: 6px 0 2px 16px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.event .ev-body p { margin: 0 0 6px; }
.event .ev-body pre.json { margin-bottom: 6px; }
.event .ev-body .model { margin-top: 6px; }
.event.plain { display: flex; gap: 7px; align-items: baseline; }
.ev-allowed summary b { color: var(--ok); }
.ev-denied summary b { color: var(--bad); }
.ev-unrecorded summary b { color: var(--text); }
.event .goto { margin-top: 6px; }
.btn-link { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; font-size: 13px; }

/* the dock: the permission prompt stays in sight at the bottom of the window */
.dock { position: sticky; bottom: 0; z-index: 2; padding-bottom: 24px; }
.dock:not(:empty) { padding: 16px 0 14px; background: linear-gradient(to bottom, transparent, var(--bg) 16px); }
.perm {
  border: 1px solid var(--ask-border); background: var(--ask-bg); border-radius: 14px; padding: 14px 16px 14px;
  box-shadow: var(--shadow); outline: none; max-height: min(70vh, 560px); overflow: auto;
}
.perm:focus, .perm:focus-visible { outline: none; }
.perm h2 { font-size: 15px; margin: 0; line-height: 1.35; font-weight: 650; overflow-wrap: anywhere; }
.perm h2 code { font-size: 14px; }
.perm .from { margin: 3px 0 10px; font-size: 13px; color: var(--muted); }
.args { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 14px; margin: 0 0 8px; font-size: 13.5px; }
.args dt { font-family: var(--mono); font-size: 12.5px; color: var(--muted); padding-top: 1px; }
.args dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.args dd.id { font-family: var(--mono); font-size: 12.5px; }
.args dd.name { font-weight: 650; }
.namepill { display: inline-block; font-size: 11px; font-weight: 600; background: var(--name-bg); color: var(--name-text); padding: 0 6px; border-radius: 999px; margin-left: 6px; vertical-align: 1px; white-space: nowrap; }
.perm .why { font-size: 12.5px; color: var(--muted); margin: 0 0 10px; }
.perm details { font-size: 12.5px; margin-bottom: 12px; }
.perm summary { cursor: pointer; color: var(--muted); }
.perm details pre.json { margin-top: 6px; background: var(--surface); }
.perm-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.btn {
  border-radius: 9px; padding: 8px 18px; min-height: 38px; cursor: pointer; font-weight: 600; font-size: 14px; border: 1px solid var(--border);
  background: var(--surface);
}
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.perm-queue { font-size: 12px; color: var(--muted); margin: 0 0 6px; }

@media (max-width: 520px) {
  body { font-size: 14.5px; }
  .chat { padding-top: 14px; }
  .args { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .args dt { margin-top: 6px; }
  .event { padding-left: 0; }
  .msg-user { max-width: 92%; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>
<a class="skip" href="#chat">Skip to the chat</a>
<div class="app">
  <header class="top">
    <button type="button" class="ibtn menu" id="menu" aria-controls="side" aria-expanded="false" aria-label="Scenarios"></button>
    <div class="brand">
      <h1>midPoint MCP server <span class="title-sub">views demo</span></h1>
      <p class="fine">A simulated MCP Apps host, the way a chat app such as Claude renders MCP Apps views. Every answer comes from the repository's recorded test data.</p>
    </div>
    <button type="button" class="ibtn" id="theme"></button>
  </header>
  <div class="app-body">
    <nav class="side" id="side" aria-label="Scenarios"><div id="scenario-list"></div></nav>
    <div class="scrim" id="scrim" hidden></div>
    <main id="chat" class="chat" tabindex="-1">
      <div class="scn-line" id="scn-line"></div>
      <div class="col" id="col">
        <ol class="transcript" id="transcript" aria-label="Conversation"></ol>
        <div class="nextbar" id="nextbar"></div>
        <div class="dock" id="perm-slot"></div>
      </div>
    </main>
  </div>
</div>

entColor}\n.mp-btn--approve:hover:not(:disabled){filter:brightness(.92)}\n.mp-btn--reject:hover:not(:disabled){background:var(--mp-danger-soft)}\n.mp-btn--link{min-height:32px;font-weight:600;text-decoration:none}\n.mp-btn--link:hover{text-decoration:underline}\n\n/* pills: a colour, a glyph and a word; red only means danger */\n.mp-chip{min-height:22px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--mp-neutral-soft);color:var(--mp-neutral-text);border:0}\n.mp-chip--secondary,.mp-chip--meta,.mp-chip--outline{background:var(--mp-neutral-soft);color:var(--mp-neutral-text);border:0}\n.mp-chip--outline{font-weight:600}\n.mp-chip--success{background:var(--mp-success-soft);color:var(--mp-success-text)}\n.mp-chip--danger{background:var(--mp-danger-soft);color:var(--mp-danger-text)}\n.mp-chip--alarm{background:var(--mp-danger-fill);color:var(--mp-on-danger)}\n.mp-chip--warning{background:var(--mp-warning-soft);color:var(--mp-warning-text)}\n.mp-chip--info{background:var(--mp-info-soft);color:var(--mp-info-text)}\n.mp-step{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--mp-text);white-space:nowrap}\n\n/* kind tiles: a rounded square for a thing, a circle with initials for a person (shape says kind; one tint) */\n.mp-disc{width:32px;height:32px;border-radius:8px;background:var(--mp-tile-bg);color:var(--mp-tile-fg);box-shadow:none}\n.mp-disc--sm,.mp-inline .mp-disc{width:22px;height:22px;border-radius:6px}\n.mp-disc--lg{width:44px;height:44px}\n.mp-disc--person{border-radius:50%;background:var(--mp-avatar-bg);color:var(--mp-avatar-fg)}\n.mp-disc[data-initials]::before{content:attr(data-initials);font-size:12px;font-weight:700;letter-spacing:.02em;line-height:1}\n.mp-disc--sm[data-initials]::before,.mp-inline .mp-disc[data-initials]::before{font-size:9.5px}\n.mp-disc--lg[data-initials]::before{font-size:16px}\n.mp-tname{display:inline}\n.mp-tname > .mp-disc{vertical-align:-5px;margin-right:6px}\n.mp-badge-name{color:var(--mp-text-strong);font-weight:600}\n\n/* panels keep midPoint's alert tints; their text is the strong ink in both themes */\n.mp-panel,.mp-panel .mp-muted{color:var(--mp-text-strong)}\n\n/* cards (A): avatar | who → what; pills; labelled facts; foot with actions */\n.mp-card{border-radius:12px;background:var(--mp-card)}\n.mp-card-head{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:8px 12px;padding:14px 14px 0;background:none;border-bottom:0}\n.mp-card-title{gap:2px}\n.mp-card-title h2{font-size:16px;font-weight:700;line-height:1.35;color:var(--mp-text-strong)}\n.mp-card-title .mp-about-text{font-size:14px;color:var(--mp-text)}\n.mp-card-chips{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}\n.mp-card-body{gap:12px;padding:12px 14px 14px 58px}\n.mp-card-more{padding:12px 14px;background:var(--mp-canvas-subtle)}\n.mp-card-foot{padding:10px 14px;background:none}\n.mp-facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;margin:0}\n.mp-facts dt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mp-text-muted);padding-top:3px;white-space:nowrap}\n.mp-facts dd{margin:0;color:var(--mp-text-strong);min-width:0;overflow-wrap:anywhere}\n.mp-quote{border-left:0;border-radius:8px;padding:10px 12px;background:var(--mp-canvas-subtle)}\n.mp-quote-lab{font-weight:600;color:var(--mp-text)}\n.mp-quote-text{font-size:15px}\n.mp-summary svg{color:var(--mp-primary)}\n\n/* ledger (B, full screen): one row per item, the open one shows its card */\n.mp-ledger{list-style:none;margin:0;padding:0;display:grid;border:1px solid var(--mp-border);border-radius:12px;overflow:hidden;background:var(--mp-card)}\n.mp-ledger > li + li{border-top:1px solid var(--mp-border)}\n.mp-lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;align-items:center;width:100%;min-height:52px;padding:10px 14px;background:none;border:0;text-align:left;color:inherit;font:inherit;cursor:pointer}\n. inter;color:var(--mp-text-strong)}\n.mp-checkbox input{appearance:auto;width:18px;height:18px;margin:3px;accent-color:var(--mp-primary)}\n.mp-inline .mp-disc--person,.mp-disc--sm.mp-disc--person{border-radius:50%}\n\n/* a choice as pills (who it is for, how many days) and as a segmented control (how long); the radio stays the control */\n.mp-picker,.mp-dialog-sec{display:grid;gap:8px;margin:0;padding:0;border:0;min-width:0}\n.mp-picker{gap:0}\n.mp-picks{display:flex;flex-wrap:wrap;gap:8px}\n.mp-pill{position:relative;display:inline-flex;align-items:center;gap:8px;min-height:36px;max-width:100%;padding:3px 14px 3px 4px;border:1px solid var(--mp-control-border);border-radius:999px;background:var(--mp-card);color:var(--mp-text-strong);font-weight:600;cursor:pointer}\n.mp-pill--plain{min-height:32px;padding:3px 14px}\n.mp-pill > .mp-disc{width:28px;height:28px}\n.mp-pill > span:not(.mp-disc){min-width:0;overflow-wrap:anywhere}\n.mp-pill > svg{flex:none;color:var(--mp-primary)}\n.mp-pill:hover:not(.is-on){background:var(--mp-canvas-subtle)}\n.mp-pill.is-on{background:var(--mp-primary-soft);border-color:var(--mp-primary);box-shadow:inset 0 0 0 1px var(--mp-primary)}\n.mp-pill > input,.mp-seg > label > input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}\n.mp-pill:has(> input:focus-visible){outline:2px solid var(--mp-focus);outline-offset:2px;box-shadow:var(--mp-focus-shadow)}\n.mp-pill:has(> input:disabled),.mp-seg > label:has(> input:disabled){cursor:not-allowed;opacity:.6}\n.mp-seg{display:flex;border:1px solid var(--mp-control-border);border-radius:8px;overflow:hidden;background:var(--mp-card)}\n.mp-seg > label{position:relative;flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;min-height:36px;padding:4px 10px;white-space:nowrap;text-align:center;font-weight:600;color:var(--mp-text);cursor:pointer}\n.mp-seg > label + label{border-left:1px solid var(--mp-control-border)}\n.mp-seg > label:hover:not(.is-on){background:var(--mp-canvas-subtle)}\n.mp-seg > label.is-on{background:var(--mp-primary);color:var(--mp-on-primary)}\n.mp-seg > label:has(> input:focus-visible){outline:2px solid var(--mp-focus);outline-offset:-4px}\n.mp-subchoice{display:grid;gap:10px;padding-top:2px}\n.mp-days{max-width:180px}\n.mp-dates{display:grid;gap:10px 12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}\n\n/* search: one box with a glyph; the label is for screen readers, the placeholder repeats it */\n.mp-search{position:relative;min-width:0}\n.mp-search > svg{position:absolute;left:11px;top:50%;margin-top:-8px;color:var(--mp-text-muted);pointer-events:none}\n.mp-search > .mp-input{padding-left:36px}\n\n/* the catalog: a heading with the count, a bordered list of rows, the approval hint under it */\n.mp-filtered{display:grid;gap:8px;min-width:0;transition:opacity .1s}\n.mp-filtered.is-busy{opacity:.45}\n.mp-section-title--plain{text-transform:none;letter-spacing:0;font-size:14px}\n.mp-role{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:6px 12px;align-items:start;padding:12px 14px;min-width:0}\n.mp-role-main{display:grid;gap:2px;min-width:0;padding-top:5px}\n.mp-role-title{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}\n.mp-role-name{font-size:15px;font-weight:600;line-height:1.4;color:var(--mp-text-strong);overflow-wrap:anywhere}\n.mp-role-desc{font-size:14px;line-height:1.45;color:var(--mp-text)}\n.mp-role .mp-more,.mp-role .mp-open{min-height:24px;justify-self:start}\n.mp-role-act{display:flex;align-items:center;min-height:36px;margin-top:-2px}\n.mp-role-out{grid-column:2/-1;min-width:0}\n.mp-chip-text{min-width:0}\n.mp-hint{font-size:13px}\n.mp-btn--ghost{padding-inline:14px}\n.mp-lhead{display:none}\n.mp-lc{min-width:0}\n.mp-lc-role{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start}\n@container (min-width:560px){\n  .mp-ltable{grid-template-columns:minmax(0,1fr) auto auto auto;column-gap:20px}\n  .mp-ltabl ywhere}\n\n@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"mp\" id=\"mp-root\">\u003c/div>\n\u003cdiv class=\"mp-sr\" id=\"mp-polite\" aria-live=\"polite\">\u003c/div>\n\u003cdiv class=\"mp-sr\" id=\"mp-assertive\" aria-live=\"assertive\">\u003c/div>\n\u003cscript>\n(() => {\n'use strict';\n\n/* ================= string catalog (contract section 10) =================\n   Every English string of this view, keyed by its contract key. ICU-style:\n   {arg}, {n, plural, =2 {…} one {…} other {…}} with #, {v, select, a {…} other {…}}. */\nconst CAT = {\n'app.title.accessReview':`My team's access`,\n'header.mode.personal':`midPoint sees everything here as {name}, this server's own account.`,\n'header.mode.personal.help':`This server signs in to midPoint with its configured account, so midPoint sees that account on every request, whoever is using the assistant.`,\n'header.sharedCredential':`This server signs in to midPoint with a shared account, {name}, so it can't show what's yours.`,\n'common.refresh':`Refresh`,\n'common.refreshing':`Refreshing…`,\n'common.asOf':`As of {time}`,\n'common.askAssistantToRefresh':`To update this view, ask the assistant to run it again.`,\n'common.readOnlyHost':`This app can show this view but not act from it. To make changes, ask the assistant.`,\n'common.expand':`Expand`,\n'common.collapse':`Exit full screen`,\n'common.cancel':`Cancel`,\n'common.showDetails':`Show technical details`,\n'common.hideDetails':`Hide technical details`,\n'common.showMore':`Show more`,\n'common.showLess':`Show less`,\n'common.andMore':`{count, plural, one {# more} other {# more}}`,\n'common.whatsThis':`What's this?`,\n'common.you':`you`,\n'common.personHidden':`a person you can't see in midPoint`,\n'common.personHiddenStart':`A person you can't see in midPoint`,\n'common.itemHidden':`an item you can't see in midPoint`,\n'common.request':`the request`,\n'common.inherited':`Comes with other access`,\n'common.inheritedVia':`Comes with {source}`,\n'common.detailsTool':`Tool: {tool}`,\n'common.redacted':`[address removed]`,\n'common.openInMidpoint':`Open in midPoint`,\n'common.openInMidpointLabel':`Open in midPoint: {name}`,\n'common.openInMidpointNote':`\"Open in midPoint\" opens midPoint's own pages. You may need to sign in there, and some pages need midPoint permissions you might not have.`,\n'state.slow':`Still waiting for midPoint…`,\n'state.cancelled':`This request was cancelled.`,\n'state.cancelledReason':`This request was cancelled: {reason}`,\n'state.versionMismatch':`This view doesn't match the server's version. The server's answer is shown as text below.`,\n'state.textOnly':`This answer can't be shown as a view. Here is the server's text.`,\n'dryrun.banner.title':`Preview only`,\n'dryrun.banner.body':`Changes are turned off on this server. Buttons show what would be sent to midPoint; nothing is changed.`,\n'dryrun.submit':`Show preview`,\n'dryrun.result.title':`Preview: nothing was changed`,\n'dryrun.details.request':`Request that would be sent`,\n'dryrun.details.summary':`Server summary: {summary}`,\n'strip.source':`Reported by {source}`,\n'strip.sourceUnnamed':`Reported by the connection between the assistant and midPoint`,\n'strip.held.title':`Waiting for approval`,\n'strip.held.body':`This action is waiting for approval by {approver}. It hasn't reached midPoint yet.`,\n'strip.held.bodyNoApprover':`This action is waiting for approval. It hasn't reached midPoint yet.`,\n'strip.denied.title':`Blocked`,\n'strip.denied.body':`This action was blocked before it reached midPoint.`,\n'strip.reason':`Reason: {reason}`,\n'strip.expires':`Expires {time}`,\n'strip.ref':`Reference: {ref}`,\n'confirm.row.role':`Role`,\n'confirm.row.for':`For`,\n'confirm.row.from':`From`,\n'confirm.row.request':`Request`,\n'confirm.row.validity':`How long`,\n'confirm.working':`Working…`,\n'conf ute`,\n'time.inMinutes':`{count, plural, one {in # minute} other {in # minutes}}`,\n'time.inHours':`{count, plural, one {in # hour} other {in # hours}}`,\n'time.inDays':`{count, plural, one {in # day} other {in # days}}`,\n'time.todayAt':`today, {time}`,\n'time.tomorrowAt':`tomorrow, {time}`,\n'time.today':`today`,\n'time.tomorrow':`tomorrow`,\n'review.loading':`Loading access…`,\n'review.person.label':`Your team`,\n'review.person.selfOption':`{name} (you)`,\n'review.person.otherOption':`{name} (not your direct report)`,\n'review.relation.directReport':`Reports to you`,\n'review.relation.self':`This is your own access. Removing your own roles isn't offered here.`,\n'review.relation.other':`You can see this person's access, but they aren't your direct report.`,\n'review.section.roles':`Roles`,\n'review.section.inherited':`Comes with other roles`,\n'review.section.orgs':`Teams`,\n'review.section.other':`Other access`,\n'review.other.account':`Account in {name}`,\n'review.inherited.hint':`These can't be removed on their own.`,\n'review.org.manager':`Manager`,\n'review.org.member':`Member`,\n'review.link.approver':`Approves requests for it`,\n'review.link.owner':`Owner`,\n'review.role.starts':`Starts {date}`,\n'review.role.endsIn':`{count, plural, =0 {Ends today} =1 {Ends tomorrow} other {Ends in # days}}`,\n'review.role.since':`Since {date}`,\n'review.role.until':`{first, select, yes {Until {date}} other {until {date}}}`,\n'review.role.approvedBy':`{first, select, yes {Approved by {name}} other {approved by {name}}}`,\n'review.role.requestedBy':`{first, select, yes {Requested by {name}} other {requested by {name}}}`,\n'review.role.addedBy':`{first, select, yes {Added by {name}} other {added by {name}}}`,\n'review.col.access':`Access`,\n'review.col.since':`Since`,\n'review.col.until':`Until`,\n'review.action.revoke':`Remove`,\n'review.action.revokeLabel':`Remove {role} from {user}`,\n'review.action.preview':`Preview removal`,\n'review.action.previewLabel':`Preview remov <script>
// The simulated MCP Apps host (MCP Apps 2026-01-26). The bridge is adapted
// from the view harness's fake host, test/views/host.js: the view runs in a
// sandboxed iframe with an opaque origin (srcdoc, sandbox="allow-scripts"),
// the host answers ui/initialize with hostContext and hostCapabilities, sends
// nothing before ui/notifications/initialized, then delivers the entry call's
// tool-input and tool-result, answers the view's tools/call from recorded
// fixtures, and answers ui/open-link, ui/message, ui/update-model-context and
// ui/request-display-mode. What this host adds: a chat around the view, and a
// permission prompt before any tool that changes midPoint runs.
(() => {
  'use strict';

  const DATA = JSON.parse(document.getElementById('demo-data').textContent);
  const PROTOCOL = '2026-01-26';
  const CAPS = { serverTools: {}, openLinks: {}, message: {}, updateModelContext: {} };
  const WRITE = new Set(DATA.writeTools);
  const WIDTHS = [
    { id: 'phone', label: 'Phone', px: 420, icon: '<rect x="4.5" y="1.8" width="7" height="12.4" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 12h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>' },
    { id: 'chat', label: 'Chat window', px: 640, icon: '<path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>' },
    { id: 'expanded', label: 'Wide', px: 860, icon: '<path d="M1.8 4h12.4v8H1.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M5 8h6M9.5 6.5 11 8l-1.5 1.5M6.5 6.5 5 8l1.5 1.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>' },
  ];
  const FULL_PX = 860; // the width a view gets in fullscreen
  const THEMES = [
    { id: 'auto', label: 'Theme: automatic', icon: '<circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/>' },
    { id: 'light', label: 'Theme: light', icon: '<circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>' },
    { id: 'dark', label: 'Theme: dark', icon: '<path d="M13 9.6A5.5 5.5 0 0 1 6.4 3a5.5 5.5 0 1 0 6.6 6.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>' },
  ];
  const ICON_MENU = '<path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>';
  const HOST_FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
  // Small pauses, so the views' own loading and working states show.
  const RESULT_DELAY = 300;
  const READ_DELAY = 220;
  const WRITE_DELAY = 350;
  const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  const $ = (id) => document.getElementById(id);
  const clone = (v) => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
  let uid = 0;
  const nextId = (p) => `${p}-${++uid}`;

  function h(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : String(v));
    }
    for (const c of kids.flat(Infinity)) {
      if (c === null || c === undefined || c === false) continue;
      n.append(c instanceof Node ? c : String(c));
    }
    return n;
  }
  const code = (t) => h('code', null, t);
  // ticks turns `tool_name` in stage directions into code.
  const ticks = (text) => String(text).split(/`([^`]+)`/).map((part, i) => (i % 2 ? code(part) : part));
  const fxTag = (name) => h('span', { class: 'fx' }, name);
  const svg = (paths, cls) => {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    s.setAttribute('viewBox', '0 0 16 16');
    s.setAttribute('width', '16');
    s.setAttribute('height', '16');
    s.setAttribute('aria-hidden', 'true');
    if (cls) s.setAttribute('class', cls);
    s.innerHTML = paths;
    return s;
  };
  const ICON_TICK = '<path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>';
  const ICON_CHEV = '<path d="M6 3.5L10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>';

  function announce(text) {
    const n = $('announce');
    n.textContent = '';
    setTimeout(() => { n.textContent = text; }, 30);
  }

  // --- preferences (per viewer; the page works without storage) ---
  const prefs = { width: 'chat', theme: 'auto' };
  try {
    const saved = JSON.parse(localStorage.getItem('midpoint-views-demo') || '{}');
    if (WIDTHS.some((w) => w.id === saved.width)) prefs.width = saved.width;
    if (THEMES.some((t) => t.id === saved.theme)) prefs.theme = saved.theme;
  } catch (e) {
    // storage blocked: defaults
  }
  const savePrefs = () => {
    try {
      localStorage.setItem('midpoint-views-demo', JSON.stringify(prefs));
    } catch (e) {
      // not kept
    }
  };

  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  const resolvedTheme = () => (prefs.theme === 'auto' ? (mq && mq.matches ? 'dark' : 'light') : prefs.theme);
  const widthPx = () => WIDTHS.find((w) => w.id === prefs.width).px;
  const scenarioById = (id) => DATA.scenarios.find((s) => s.id === id);

  // --- one scenario: the chat and its view ---
  let session = null;

  class Session {
    constructor(scn) {
      this.scn = scn;
      this.view = DATA.views[scn.view];
      this.entry = DATA.fixtures[scn.entry];
      this.state = '';
      this.initializeAnswered = false;
      this.initialized = false;
      this.displayMode = 'inline';
      this.sentTheme = null;
      this.seenIds = new Set();
      this.asks = []; // write calls waiting for the person's answer
      this.asking = null;
      this.timers = new Set();
      this.dead = false;
      this.build();
    }

    later(fn, ms) {
      const t = setTimeout(() => {
        this.timers.delete(t);
        if (!this.dead) fn();
      }, ms);
      this.timers.add(t);
    }

    dispose() {
      this.dead = true;
      for (const t of this.timers) clearTimeout(t);
      this.timers.clear();
      $('perm-slot').textContent = '';
    }

    // --- the transcript ---
    add(node) {
      $('transcript').append(node);
      return node;
    }

    build() {
      const { scn, view, entry } = this;
      $('transcript').textContent = '';
      $('perm-slot').textContent = '';
      renderScenarioLine(scn);
      renderNext(scn);
      markCurrent(scn);

      this.add(h('li', { class: 'msg-user' }, h('span', { class: 'who' }, 'You'), h('div', { class: 'bubble' }, scn.user)));

      const panelId = nextId('call');
      const chip = h(
        'button',
        { type: 'button', class: 'chip', 'aria-expanded': 'false', 'aria-controls': panelId },
        svg(ICON_TICK, 'tick'),
        h('span', { class: 'srv' }, 'midpoint'),
        h('span', { 'aria-hidden': 'true', class: 'srv' }, '·'),
        code(entry.call.name),
        svg(ICON_CHEV, 'chev'),
      );
      const panel = h(
        'div',
        { class: 'chip-panel', id: panelId, hidden: true },
        h('span', { class: 'lab' }, 'Arguments'),
        h('pre', { class: 'json' }, JSON.stringify(entry.call.arguments ?? {}, null, 2)),
        h('span', { class: 'lab' }, 'Answered from'),
        h('p', { class: 'about' }, fxTag(this.scn.entry), ' ', entry.about),
        h('span', { class: 'lab', style: 'margin-top:10px' }, 'Shown as'),
        h('p', { class: 'about' }, code(view.uri)),
      );
      chip.addEventListener('click', () => {
        const open = chip.getAttribute('aria-expanded') === 'true';
        chip.setAttribute('aria-expanded', String(!open));
        panel.hidden = open;
      });
      this.add(
        h(
          'li',
          { class: 'msg-assistant' },
          h('span', { class: 'avatar', 'aria-hidden': 'true' }, 'A'),
          h('div', { class: 'body' }, h('span', { class: 'sr-only' }, 'Assistant: '), h('p', null, scn.assistant), h('div', { class: 'toolcall' }, chip, panel)),
        ),
      );

      // The view: its document as the server serves it, in a sandboxed frame.
      const frame = h('iframe', { sandbox: 'allow-scripts', title: `${view.title}, an MCP Apps view` });
      frame.srcdoc = view.html;
      this.frame = frame;
      this.modeTag = h('span', { class: 'mode-tag' }, 'inline');
      this.block = h('div', { class: 'viewblock' }, frame);
      // What the assistant reads: a tab next to the view, not a page-wide switch.
      const model = modelPanel(['from the ', code(entry.call.name), ' result'], textOf(entry.result));
      model.hidden = true;
      const tabView = h('button', { type: 'button', role: 'tab', 'aria-selected': 'true' }, 'View');
      const tabText = h('button', { type: 'button', role: 'tab', 'aria-selected': 'false' }, 'Text the assistant reads');
      const pickTab = (text) => {
        tabView.setAttribute('aria-selected', String(!text));
        tabText.setAttribute('aria-selected', String(text));
        this.block.hidden = text;
        model.hidden = !text;
      };
      tabView.addEventListener('click', () => pickTab(false));
      tabText.addEventListener('click', () => pickTab(true));
      this.sizeBox = h('div', { class: 'sizes', role: 'radiogroup', 'aria-label': 'View size' });
      renderSizes(this.sizeBox);
      this.add(
        h(
          'li',
          { class: 'view-li' },
          h('div', { class: 'vbar' }, h('div', { class: 'vtabs', role: 'tablist', 'aria-label': 'What to show' }, tabView, tabText), this.sizeBox),
          this.block,
          model,
          h('p', { class: 'viewcap' }, h('span', null, 'MCP Apps view'), code(view.uri), h('span', { 'aria-hidden': 'true' }, '·'), this.modeTag),
        ),
      );
      this.layout();
    }

    // event adds a host note under the view.
    event(kind, ...kids) {
      return this.add(h('li', { class: `event ${kind}` }, ...kids));
    }

    // --- the bridge ---
    post(msg) {
      if (this.dead || !this.frame.contentWindow) return;
      this.frame.contentWindow.postMessage(msg, '*'); // the view's origin is opaque
    }
    respond(id, result) {
      this.post({ jsonrpc: '2.0', id, result });
    }
    respondError(id, code, message) {
      this.post({ jsonrpc: '2.0', id, error: { code, message } });
    }
    notify(method, params) {
      if (!this.initialized) return false; // nothing before initialized
      this.post({ jsonrpc: '2.0', method, params: params ?? {} });
      return true;
    }

    hostContext() {
      const lang = navigator.language || '';
      let timeZone;
      try {
        timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
      } catch (e) {
        timeZone = undefined;
      }
      return {
        theme: resolvedTheme(),
        displayMode: this.displayMode,
        availableDisplayModes: ['inline', 'fullscreen'],
        containerDimensions: { width: this.frame.clientWidth || widthPx(), maxHeight: 4000 },
        locale: /^en(-|$)/i.test(lang) ? lang : 'en-GB',
        timeZone,
        platform: 'web',
        toolInfo: { id: 'call-1', tool: { name: this.entry.call.name, inputSchema: { type: 'object' } } },
        styles: { variables: { '--font-sans': HOST_FONT } },
      };
    }

    onMessage(msg) {
      if (!msg || typeof msg !== 'object' || msg.jsonrpc !== '2.0') return;
      if (msg.method === undefined) return; // this host sends no requests
      if (msg.id !== undefined && msg.id !== null) {
        const key = JSON.stringify(msg.id);
        if (this.seenIds.has(key)) return;
        this.seenIds.add(key);
        if (!this.initializeAnswered && msg.method !== 'ui/initialize') {
          this.respondError(msg.id, -32002, 'Not initialized');
          return;
        }
        this.onRequest(msg);
      } else {
        this.onNotification(msg);
      }
    }

    onRequest(msg) {
      const p = msg.params && typeof msg.params === 'object' ? msg.params : {};
      switch (msg.method) {
        case 'ui/initialize':
          this.initializeAnswered = true;
          this.respond(msg.id, {
            protocolVersion: PROTOCOL,
            hostInfo: { name: 'midpoint-views-demo-host', version: '1.0.0' },
            hostCapabilities: clone(CAPS),
            hostContext: this.hostContext(),
          });
          return;
        case 'tools/call':
          this.toolCall(msg.id, p);
          return;
        case 'ui/open-link':
          this.respond(msg.id, {});
          this.event(
            'plain',
            h('span', null, 'The view asked to open ', code(String(p.url ?? '')), '. A chat app would open it in a new tab; this demo does not.'),
          );
          return;
        case 'ui/message':
          this.respond(msg.id, {});
          this.viewMessage(p);
          return;
        case 'ui/update-model-context':
          this.respond(msg.id, {});
          this.contextUpdate(p);
          return;
        case 'ui/request-display-mode': {
          const want = p.mode;
          if (want === 'inline' || want === 'fullscreen') {
            if (want !== this.displayMode) {
              this.displayMode = want;
              this.layout();
              this.event(
                'plain',
                h('span', null, want === 'fullscreen' ? `The view asked for fullscreen: the host widened it to ${FULL_PX} px.` : 'The view went back inline.'),
              );
            }
          }
          this.respond(msg.id, { mode: this.displayMode });
          return;
        }
        default:
          this.respondError(msg.id, -32601, `Method not found: ${msg.method}`);
      }
    }

    onNotification(msg) {
      switch (msg.method) {
        case 'ui/notifications/initialized':
          if (this.initialized) return;
          this.initialized = true;
          this.sentTheme = resolvedTheme();
          this.later(() => {
            this.notify('ui/notifications/tool-input', { arguments: clone(this.entry.call.arguments ?? {}) });
            this.later(() => this.notify('ui/notifications/tool-result', clone(this.entry.result)), RESULT_DELAY);
          }, 0);
          return;
        case 'ui/notifications/size-changed': {
          const height = msg.params && msg.params.height;
          if (typeof height === 'number' && height > 0) this.frame.style.height = `${Math.max(120, Math.ceil(height))}px`;
          return;
        }
        default:
        // nothing else to do
      }
    }

    themeChanged() {
      const theme = resolvedTheme();
      if (!this.initialized || theme === this.sentTheme) return;
      this.sentTheme = theme;
      this.notify('ui/notifications/host-context-changed', { theme });
    }

    layout() {
      if (!this.block) return;
      if (this.displayMode === 'fullscreen') {
        const col = $('col');
        const avail = document.documentElement.clientWidth - 32;
        const w = Math.max(280, Math.min(FULL_PX, avail));
        this.block.style.width = `${w}px`;
        this.block.style.marginLeft = `${Math.round((col.clientWidth - w) / 2)}px`;
        this.block.classList.add('full');
      } else {
        this.block.style.width = '';
        this.block.style.marginLeft = '';
        this.block.classList.remove('full');
      }
      this.modeTag.textContent = this.displayMode;
    }

    // --- tool calls ---
    find(name, args) {
      const list = this.scn.answers[name] || [];
      return list.find((a) => (a.state === undefined || a.state === this.state) && subset(a.when, args)) || null;
    }

    toolCall(id, p) {
      const name = typeof p.name === 'string' ? p.name : '';
      const args = p.arguments && typeof p.arguments === 'object' ? p.arguments : {};
      if (WRITE.has(name)) {
        this.asks.push({ id, name, args });
        if (!this.asking) this.askNext();
        return;
      }
      const a = this.find(name, args);
      const body = h(
        'div',
        { class: 'ev-body' },
        h('span', { class: 'lab' }, 'Arguments'),
        h('pre', { class: 'json' }, JSON.stringify(args, null, 2)),
        a ? h('p', null, 'Answered from ', fxTag(a.fx), ' ', DATA.fixtures[a.fx].about) : h('p', null, 'No recorded answer: the host answered with an error.'),
      );
      this.event(
        'ev-read',
        h('details', null, h('summary', null, h('span', null, 'The view read ', code(name), ': read-only, so the host did not ask.')), body),
      );
      if (!a) {
        this.later(() => this.respondError(id, -32603, `No recorded answer for ${name} in this demo`), READ_DELAY);
        return;
      }
      this.later(() => this.respond(id, clone(DATA.fixtures[a.fx].result)), READ_DELAY);
    }

    // askNext shows the permission prompt for the next waiting write.
    askNext() {
      const call = this.asks.shift();
      this.asking = call || null;
      const slot = $('perm-slot');
      slot.textContent = '';
      if (!call) return;
      const titleId = nextId('perm-title');
      const descId = nextId('perm-desc');
      const names = Object.keys(call.args).filter((k) => isNameKey(k, call.args[k]));
      const deny = h('button', { type: 'button', class: 'btn' }, 'Deny');
      const allow = h('button', { type: 'button', class: 'btn btn-primary' }, 'Allow');
      const card = h(
        'section',
        { class: 'perm', role: 'alertdialog', 'aria-modal': 'false', 'aria-labelledby': titleId, 'aria-describedby': descId, tabindex: '-1' },
        this.asks.length ? h('p', { class: 'perm-queue' }, `${this.asks.length} more waiting after this one`) : null,
        h('h2', { id: titleId }, 'Allow the midpoint server to run ', code(call.name), '?'),
        h('p', { class: 'from', id: descId }, 'The ', h('b', null, this.view.title), ' view asks to run it. It changes data in midPoint.'),
        argList(call.args),
        names.length
          ? h(
              'p',
              { class: 'why' },
              names.map((k, i) => [i ? (i === names.length - 1 ? ' and ' : ', ') : '', code(k)]),
              names.length > 1 ? ' are midPoint names' : ' is a midPoint name',
              ', sent next to the IDs so you can see what you allow; the server checks them against the IDs before it writes.',
            )
          : null,
        h('details', null, h('summary', null, 'Arguments as JSON'), h('pre', { class: 'json' }, JSON.stringify(call.args, null, 2))),
        h('div', { class: 'perm-actions' }, deny, allow),
      );
      deny.addEventListener('click', () => this.answerAsk(call, false));
      allow.addEventListener('click', () => this.answerAsk(call, true));
      slot.append(card);
      card.focus({ preventScroll: true });
      announce(`Permission needed: allow the midpoint server to run ${call.name}?`);
    }

    answerAsk(call, allowed) {
      if (this.asking !== call) return;
      const details = (summary, ...rest) =>
        h('details', null, h('summary', null, summary), h('div', { class: 'ev-body' }, argList(call.args), ...rest));
      if (!allowed) {
        this.event(
          'ev-denied',
          details(h('span', null, h('b', null, 'Denied'), ' ', code(call.name), ': the host answered the view with an error.')),
        );
        this.later(() => this.respondError(call.id, -32000, 'The user denied this tool call.'), 120);
      } else {
        const a = this.find(call.name, call.args);
        if (a) {
          if (a.set !== undefined) this.state = a.set;
          const fx = DATA.fixtures[a.fx];
          this.event(
            'ev-allowed',
            details(
              h('span', null, h('b', null, 'Allowed'), ' ', code(call.name), ': answered from ', fxTag(a.fx)),
              h('p', null, fx.about),
              h('span', { class: 'lab' }, 'Result text'),
              h('pre', { class: 'json' }, textOf(fx.result)),
            ),
          );
          this.later(() => this.respond(call.id, clone(fx.result)), WRITE_DELAY);
        } else {
          this.event(
            'ev-unrecorded',
            details(
              h('span', null, h('b', null, 'Allowed'), ' ', code(call.name), ', but this demo has no recording for these arguments'),
              h('p', null, 'So the host answered with an error, which the view reads as a refusal. Recorded in this scenario: ', ticks(this.scn.recorded), '.'),
            ),
          );
          this.later(() => this.respondError(call.id, -32603, 'No recorded answer for this call in the demo.'), WRITE_DELAY);
        }
      }
      // Give focus back to the view, so the focus it moves to its outcome lands.
      this.frame.focus();
      this.askNext();
    }

    // --- what the view tells the chat ---
    viewMessage(p) {
      const text = arr(p.content)
        .filter((c) => c && c.type === 'text' && typeof c.text === 'string')
        .map((c) => c.text)
        .join('\n');
      this.add(h('li', { class: 'msg-user' }, h('span', { class: 'who' }, 'Sent by the view (ui/message)'), h('div', { class: 'bubble' }, text || '(no text)')));
      const next = this.scn.next ? scenarioById(this.scn.next) : null;
      this.event(
        'plain',
        h(
          'div',
          null,
          h('span', null, 'A chat app would now pass this to the assistant as your next message; this demo stops here.'),
          next
            ? h('div', { class: 'goto' }, h('button', { type: 'button', class: 'btn-link', onclick: () => go(next.id, true) }, `Continue with the next scenario: ${next.title}`))
            : null,
        ),
      );
    }

    contextUpdate(p) {
      const text = arr(p.content)
        .filter((c) => c && c.type === 'text' && typeof c.text === 'string')
        .map((c) => c.text)
        .join('\n');
      const shown = text || (p.structuredContent !== undefined ? JSON.stringify(p.structuredContent, null, 2) : '');
      this.event(
        'ev-context',
        h('div', null, h('span', null, 'The view updated what the assistant knows (', code('ui/update-model-context'), ').')),
        modelPanel('from this update', shown),
      );
    }
  }

  // --- helpers ---
  function arr(v) {
    return Array.isArray(v) ? v : [];
  }
  function subset(want, got) {
    if (!want) return true;
    for (const [k, v] of Object.entries(want)) {
      if (JSON.stringify(v) !== JSON.stringify(got ? got[k] : undefined)) return false;
    }
    return true;
  }
  function textOf(result) {
    return arr(result && result.content)
      .filter((c) => c && c.type === 'text' && typeof c.text === 'string')
      .map((c) => c.text)
      .join('\n\n');
  }
  function isNameKey(k, v) {
    return typeof v === 'string' && /Name$/.test(k);
  }
  function modelPanel(source, text) {
    return h(
      'div',
      { class: 'model' },
      h('p', { class: 'model-head' }, h('span', { class: 'lab' }, 'What the model reads'), h('span', { class: 'model-src' }, source)),
      h('pre', null, text || '(no text)'),
    );
  }
  // argList shows a call's arguments as the host's prompt does: one line
  // each, names marked, IDs in a fixed-width face.
  function argList(args) {
    const dl = h('dl', { class: 'args' });
    for (const [k, v] of Object.entries(args)) {
      const text = typeof v === 'string' ? v : JSON.stringify(v);
      const isName = isNameKey(k, v);
      const isId = typeof v === 'string' && (UUID.test(v) || /(Oid|Id)$/.test(k));
      dl.append(
        h('dt', null, k),
        h('dd', { class: isName ? 'name' : isId ? 'id' : '' }, text, isName ? h('span', { class: 'namepill' }, 'midPoint name') : null),
      );
    }
    if (!dl.childNodes.length) dl.append(h('dt', null, '(none)'), h('dd', null, ''));
    return dl;
  }

  // --- page controls ---
  const initials = (persona) => String(persona).split(',')[0].split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();

  // The scenario list: like a chat app's conversations, titled by what the
  // person asks, grouped by role.
  function renderList() {
    const box = $('scenario-list');
    box.textContent = '';
    let group = null;
    let ul = null;
    for (const s of DATA.scenarios) {
      if (s.group !== group) {
        group = s.group;
        const gid = nextId('grp');
        box.append(h('h2', { class: 'grp', id: gid }, group));
        ul = h('ul', { class: 'convs', 'aria-labelledby': gid });
        box.append(ul);
      }
      ul.append(
        h(
          'li',
          null,
          h(
            'button',
            { type: 'button', class: 'conv', 'data-id': s.id, onclick: () => go(s.id, true) },
            h('span', { class: 'cav', 'aria-hidden': 'true' }, initials(s.persona)),
            h('span', { class: 'ctext' }, h('b', null, s.user), h('span', null, s.short)),
          ),
        ),
      );
    }
  }
  function markCurrent(scn) {
    document.querySelectorAll('.conv').forEach((b) => {
      if (b.dataset.id === scn.id) b.setAttribute('aria-current', 'true');
      else b.removeAttribute('aria-current');
    });
  }

  // One line above the chat: who you are and what to try; the longer
  // directions open on demand.
  function renderScenarioLine(scn) {
    const line = $('scn-line');
    line.textContent = '';
    const more = h(
      'div',
      { class: 'scn-more', id: 'scn-more', hidden: true },
      h('p', null, h('b', null, 'Try: '), ticks(scn.try)),
      h('p', null, h('b', null, 'Recorded writes: '), ticks(scn.recorded), '. Read-only calls are answered without asking.'),
    );
    const how = h('button', { type: 'button', class: 'btn-link', 'aria-expanded': 'false', 'aria-controls': 'scn-more' }, 'How to try');
    how.addEventListener('click', () => {
      const open = how.getAttribute('aria-expanded') === 'true';
      how.setAttribute('aria-expanded', String(!open));
      more.hidden = open;
    });
    line.append(
      h(
        'div',
        { class: 'scn-row' },
        h('p', { class: 'scn-who' }, h('b', null, 'You are ', scn.persona.split(',')[0]), h('span', { class: 'scn-hint' }, scn.hint)),
        h('div', { class: 'scn-acts' }, how, h('button', { type: 'button', class: 'btn-quiet', onclick: () => go(scn.id, false) }, 'Start over')),
      ),
      more,
    );
  }

  // Next: the following scenario, under the chat.
  function renderNext(scn) {
    const bar = $('nextbar');
    bar.textContent = '';
    const i = DATA.scenarios.indexOf(scn);
    const next = DATA.scenarios[i + 1];
    bar.append(h('span', { class: 'next-count' }, `Scenario ${i + 1} of ${DATA.scenarios.length}`));
    if (next) bar.append(h('button', { type: 'button', class: 'btn-link next', onclick: () => go(next.id, true) }, `Next: ${next.title} →`));
  }

  // View size: three icons on the view's edge.
  function renderSizes(box) {
    box.textContent = '';
    for (const w of WIDTHS) {
      const on = w.id === prefs.width;
      const b = h('button', { type: 'button', role: 'radio', 'aria-checked': String(on), 'aria-label': `${w.label} (${w.px} px)`, title: `${w.label} (${w.px} px)` }, svg(w.icon));
      b.addEventListener('click', () => {
        prefs.width = w.id;
        savePrefs();
        applyWidth();
      });
      box.append(b);
    }
  }

  function applyWidth() {
    document.documentElement.style.setProperty('--vw', `${widthPx()}px`);
    if (session) {
      if (session.sizeBox) renderSizes(session.sizeBox);
      session.layout();
    }
  }
  function applyTheme() {
    if (prefs.theme === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', prefs.theme);
    const t = THEMES.find((x) => x.id === prefs.theme);
    const btn = $('theme');
    btn.textContent = '';
    btn.append(svg(t.icon));
    btn.setAttribute('aria-label', `${t.label}. Change theme`);
    btn.title = t.label;
    if (session) session.themeChanged();
  }

  // On a narrow screen the list is a drawer.
  function setDrawer(open) {
    document.body.classList.toggle('drawer-open', open);
    $('menu').setAttribute('aria-expanded', String(open));
    $('scrim').hidden = !open;
  }

  function go(id, focusChat) {
    const scn = scenarioById(id) || DATA.scenarios[0];
    if (session) session.dispose();
    setDrawer(false);
    try {
      history.replaceState(null, '', `#${scn.id}`);
    } catch (e) {
      // a page opened from disk may refuse; the scenario still runs
    }
    session = new Session(scn);
    if (focusChat) {
      $('chat').focus({ preventScroll: true });
      window.scrollTo({ top: 0 });
    }
  }

  window.addEventListener('message', (ev) => {
    if (session && session.frame && ev.source === session.frame.contentWindow) session.onMessage(ev.data);
  });
  window.addEventListener('resize', () => session && session.layout());
  if (mq) {
    const onScheme = () => prefs.theme === 'auto' && applyTheme();
    if (mq.addEventListener) mq.addEventListener('change', onScheme);
    else if (mq.addListener) mq.addListener(onScheme);
  }

  renderList();
  $('menu').append(svg(ICON_MENU));
  $('menu').addEventListener('click', () => setDrawer(!document.body.classList.contains('drawer-open')));
  $('scrim').addEventListener('click', () => setDrawer(false));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && document.body.classList.contains('drawer-open')) setDrawer(false);
  });
  $('theme').addEventListener('click', () => {
    const i = THEMES.findIndex((t) => t.id === prefs.theme);
    prefs.theme = THEMES[(i + 1) % THEMES.length].id;
    savePrefs();
    applyTheme();
  });

  applyWidth();
  applyTheme();
  go((location.hash || '').slice(1), false);
})();

</script>
</body>
</html>
