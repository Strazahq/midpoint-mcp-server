<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<meta name="color-scheme" content="light dark">
<title>midPoint MCP views demo</title>
<link rel="icon" href="data:,">
<style>
/*@CSS@*/
</style>
</head>
<body>
<a class="skip" href="#chat">Skip to the chat</a>
<header class="top">
  <div class="top-inner">
    <div class="title-row">
      <h1>midPoint MCP server <span class="title-sub">views demo</span></h1>
      <p class="fine">A simulated MCP Apps host, the way a chat app such as Claude renders MCP Apps views. Not a real chat client: every answer comes from the repository's recorded test data.</p>
    </div>
    <div class="controls">
      <label class="ctl ctl-scenario">
        <span class="ctl-label">Scenario</span>
        <select id="scenario"></select>
      </label>
      <div class="ctl" role="radiogroup" aria-labelledby="width-label">
        <span class="ctl-label" id="width-label">View width</span>
        <div class="seg" id="width"></div>
      </div>
      <div class="ctl" role="radiogroup" aria-labelledby="theme-label">
        <span class="ctl-label" id="theme-label">Theme</span>
        <div class="seg" id="theme"></div>
      </div>
      <div class="ctl ctl-switches">
        <button type="button" class="switch" id="model-reads" role="switch" aria-checked="false">
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          <span>What the model reads</span>
        </button>
        <button type="button" class="btn-quiet" id="restart">Restart</button>
      </div>
    </div>
  </div>
</header>
<main id="chat" class="chat" tabindex="-1">
  <div class="col" id="col">
    <section class="intro" id="intro" aria-label="About this scenario"></section>
    <ol class="transcript" id="transcript" aria-label="Conversation"></ol>
    <div class="dock" id="perm-slot"></div>
  </div>
</main>
<div class="sr-only" aria-live="polite" id="announce"></div>
<script type="application/json" id="demo-data">/*@DATA@*/</script>
<script>
/*@JS@*/
</script>
</body>
</html>
