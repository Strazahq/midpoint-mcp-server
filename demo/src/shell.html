<body>
<a class="skip" href="#chat">Skip to the chat</a>
<div class="app">
  <header class="top">
    <button type="button" class="ibtn menu" id="menu" aria-controls="side" aria-expanded="false" aria-label="Scenarios"></button>
    <div class="brand">
      <h1>midPoint MCP server <span class="title-sub">views demo</span></h1>
      <p class="fine">A simulated MCP Apps host, the way a chat app such as Claude renders MCP Apps views. Answers come from the repository's recorded test data; where an action wasn't recorded, the host adapts the closest recording.</p>
    </div>
    <button type="button" class="ibtn" id="theme"></button>
  </header>
  <div class="app-body">
    <nav class="side" id="side" aria-label="Scenarios"><div id="scenario-list"></div></nav>
    <div class="scrim" id="scrim" hidden></div>
    <main id="chat" class="chat" tabindex="-1">
      <div class="scn-line" id="scn-line"></div>
      <div class="col" id="col">
        <ol class="transcript" id="transcript" aria-label="Conversation"></ol>
        <div class="nextbar" id="nextbar"></div>
        <div class="dock" id="perm-slot"></div>
      </div>
    </main>
  </div>
</div>
<div class="sr-only" aria-live="polite" id="announce"></div>
